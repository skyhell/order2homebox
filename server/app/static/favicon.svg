  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 11l-10-5.5L6 11l10 5.5 10-5.5z"/>
    <path d="M6 11v10l10 5.5 10-5.5V11"/>
    <path d="M16 16.5V26"/>
  </g>
</svg>
