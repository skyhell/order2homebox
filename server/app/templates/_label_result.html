<div class="card result-card" id="label-result">
  <div class="result-grid">
    <div class="result-info">
      <p class="asset-line">
        <span class="asset-badge">{{ t('asset_id_label') }} {{ asset_id }}</span>
        <a class="subtle-link" href="{{ homebox_url }}/a/{{ asset_id }}" target="_blank" rel="noopener">{{ t('open_in_homebox') }} ↗</a>
      </p>
      <div class="print-controls" id="label-print">
        <input type="hidden" name="asset_id" value="{{ asset_id }}">
        <label class="field-inline-sm">
          <span>{{ t('print_copies') }}</span>
          <input class="input input-sm" type="number" name="copies" value="{{ copies_default }}" min="1" max="20">
        </label>
        <label class="check">
          <input type="checkbox" name="show_text" value="true" id="label-show-text"
                 {% if show_asset_id_default %}checked{% endif %}
                 onchange="refreshLabelControls('{{ asset_id }}')">
          <span>{{ t('print_with_id') }}</span>
        </label>
        {# value="3" so the count travels with hx-include and needs no JS; an
           unchecked box submits nothing and /print falls back to the default. #}
        <label class="check">
          <input type="checkbox" name="qr_per_row" value="3" id="label-qr3"
                 onchange="refreshLabelControls('{{ asset_id }}')">
          <span>{{ t('print_three_up') }}</span>
        </label>
        <span class="hint" id="label-qr3-hint" hidden>{{ t('print_three_up_hint') }}</span>
        <button type="button" class="btn btn-primary"
                hx-post="/print"
                hx-include="#label-print input"
                hx-target="#label-print-status"
                hx-swap="innerHTML">{{ t('print_button') }}</button>
        <span id="label-print-status"></span>
      </div>
    </div>
    <div class="result-preview">
      <img id="label-preview-img" src="/label/{{ asset_id }}.png?text={{ 1 if show_asset_id_default else 0 }}" alt="Label preview" class="label-preview">
    </div>
  </div>
</div>
